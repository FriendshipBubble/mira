name: Build, Push & Deploy

# PRs into main are built, pushed as the `dev` tag and rolled out to the
# shared dev stack so reviewers can test the branch. Merges to main
# (push event) build/push the `prod` tag and roll out to production.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && 'dev' || 'prod' }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tag
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TAG=dev
          else
            TAG=prod
          fi
          echo "image=${IMAGE_NAME,,}:${TAG}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    # Dev and prod share one host, so a single self-hosted runner handles both;
    # the stacks are kept apart via DEPLOY_PATH and the generated Compose project name.
    runs-on: self-hosted
    environment: ${{ github.event_name == 'pull_request' && 'dev' || 'production' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy configuration from main, not from unreviewed PR changes.
          ref: ${{ github.event.pull_request.base.sha || github.sha }}

      - name: Deploy
        working-directory: ${{ vars.DEPLOY_PATH }}
        env:
          DEPLOY_IMAGE: ${{ needs.build-and-push.outputs.image }}
          DEPLOY_PORT: ${{ vars.HOST_PORT }}
          DEPLOY_ENV: ${{ github.event_name == 'pull_request' && 'dev' || 'prod' }}
        run: |
          set -euo pipefail
          test -f .env || { echo 'Missing host .env in deploy directory' >&2; exit 1; }
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] && ((10#$DEPLOY_PORT >= 1 && 10#$DEPLOY_PORT <= 65535)) || { echo 'Invalid HOST_PORT' >&2; exit 1; }

          # Render the checked-in template without resolving env_file (which contains secrets).
          # Keep project name and deployment settings in the file for manual docker compose commands.
          temp_file=$(mktemp ./docker-compose.yml.XXXXXX)
          trap 'rm -f -- "$temp_file"' EXIT
          {
            printf 'name: mira-%s\n' "$DEPLOY_ENV"
            sed -e "s|^    image: .*|    image: ${DEPLOY_IMAGE}|" \
                -e "s|^      - \".*:8000\"$|      - \"${DEPLOY_PORT}:8000\"|" \
                "$GITHUB_WORKSPACE/docker-compose.prod.yml"
          } > "$temp_file"
          docker compose -f "$temp_file" config --quiet
          mv -f -- "$temp_file" docker-compose.yml

          docker compose pull
          docker compose up -d
          docker image prune -f
