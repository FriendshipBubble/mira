services:
  mira:
    image: ${MIRA_IMAGE:-ghcr.io/friendshipbubble/mira:prod}
    env_file: .env
    environment:
      APP_ENV: production
    ports:
      - "${HOST_PORT:-8000}:8000"
    restart: unless-stopped
    networks:
      - external
  
networks:
  external:
    external: true
    name: infra_external